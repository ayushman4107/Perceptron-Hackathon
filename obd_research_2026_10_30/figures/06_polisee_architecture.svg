   <g id="text_1">
    <text style="font-weight: 700; font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: start" x="61.7472" y="54.096669" transform="rotate(-0 61.7472 54.096669)">PoliSee | System architecture</text>
   </g>
   <g id="text_2">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start" x="61.7472" y="85.118902" transform="rotate(-0 61.7472 85.118902)">From logged decisions to evidence about a different policy</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle" x="166.8096" y="135.99285" transform="rotate(-0 166.8096 135.99285)">1  INPUT</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle" x="426.7008" y="135.99285" transform="rotate(-0 426.7008 135.99285)">2  SPLIT</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle" x="719.7696" y="135.99285" transform="rotate(-0 719.7696 135.99285)">3  EVALUATE</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: middle" x="990.72" y="135.99285" transform="rotate(-0 990.72 135.99285)">4  REPORT</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle" x="166.8096" y="293.629909" transform="rotate(-0 166.8096 293.629909)">Logged decisions</text>
   </g>
   <g id="text_8">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'" transform="translate(110.97128 326.083439)">Actions, rewards</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'" transform="translate(77.918428 345.303642)">and selection probabilities</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle" x="426.7008" y="198.510263" transform="rotate(-0 426.7008 198.510263)">Pilot</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'" transform="translate(367.884042 221.974895)">Select and freeze</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'" transform="translate(365.625956 241.195098)">candidate policies</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle" x="426.7008" y="316.014263" transform="rotate(-0 426.7008 316.014263)">Certification</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'" transform="translate(361.234238 339.478895)">Estimate candidate</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'" transform="translate(386.592089 358.699098)">policy gains</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle" x="426.7008" y="445.268663" transform="rotate(-0 426.7008 445.268663)">Reference</text>
   </g>
   <g id="text_14">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'" transform="translate(362.006269 468.733295)">Independent check</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'" transform="translate(375.810019 487.953498)">only; no tuning</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle" x="719.7696" y="207.851989" transform="rotate(-0 719.7696 207.851989)">Policy-ratio compression</text>
   </g>
   <g id="text_16">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'" transform="translate(641.576123 235.840367)">Check matching ratios;</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'" transform="translate(635.908233 255.06057)">group equivalent actions</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle" x="719.7696" y="345.919189" transform="rotate(-0 719.7696 345.919189)">Uncertainty estimation</text>
   </g>
   <g id="text_18">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'" transform="translate(617.277178 373.907567)">Gain bounds + validity checks</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'" transform="translate(647.896866 393.12777)">IPS / DR comparisons</text>
   </g>
   <g id="text_19">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: middle" x="990.72" y="273.712823" transform="rotate(-0 990.72 273.712823)">Decision report</text>
   </g>
   <g id="text_20">
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'" transform="translate(894.621094 324.841348)">Gain interval + assumptions</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'" transform="translate(990.72 344.061551)"/>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'" transform="translate(900.542109 363.281754)">Evidence of improvement*</text>
    <text style="font-size: 13.5px; font-family: 'DejaVu Sans'" transform="translate(911.680664 382.501957)">or insufficient evidence</text>
   </g>
   <g id="text_21">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="769.536" y="482.353713" transform="rotate(-0 769.536 482.353713)">Held-out comparison</text>
   </g>
   <g id="text_22">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start" x="61.7472" y="545.147062" transform="rotate(-0 61.7472 545.147062)">* Improvement requires a positive lower bound and satisfied validity conditions.</text>
   </g>
   <g id="text_23">
    <text style="font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start" x="61.7472" y="573.348022" transform="rotate(-0 61.7472 573.348022)">Reference outcomes are empirical estimates, not exact counterfactual ground truth.</text>
   </g>
  </g>
